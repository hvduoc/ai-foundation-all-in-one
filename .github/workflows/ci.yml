name: ci

on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build || echo "skip build step if not applicable"

  unit-tests:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: 'true'
      REDIS_MOCK: 'true'
      USER_CACHE_TTL: '300'
      KEY_PREFIX: 'aicompany:dev:'
      # KHÔNG đặt REDIS_URL ở đây để đảm bảo không nối Redis thật
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
